[workspace]
members = ["core", "daemon", "ctl", "osk"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
evdev = "0.13"
indexmap = { version = "2.9", features = ["serde"] }
log = "0.4"
scd = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
